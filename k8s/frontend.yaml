apiVersion: apps/v1
kind: Deployment
metadata:
  name: fireflow-frontend
  namespace: fireflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fireflow-frontend
  template:
    metadata:
      labels:
        app: fireflow-frontend
    spec:
      containers:
      - name: frontend
        image: fireflow-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://fireflow-backend:5100" # Update based on ingress or cluster setup
---
apiVersion: v1
kind: Service
metadata:
  name: fireflow-frontend
  namespace: fireflow
spec:
  type: NodePort
  selector:
    app: fireflow-frontend
  ports:
  - port: 80
    targetPort: 3000
